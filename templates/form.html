{% extends "base.html" %}

{% block conteudo %}

{% if filme %}
    <h1>Editar filme</h1>
{% else %}
    <h1>Novo filme</h1>
{% endif %}

<form method="POST">
    <label>Título</label>
    <input type="text" name="titulo" required value="{{ filme['titulo'] if filme else '' }}">

    <label>Gênero</label>
    <input type="text" name="genero" required value="{{ filme['genero'] if filme else '' }}">

    <label>Ano de lançamento</label>
    <input type="number" name="ano" required value="{{ filme['ano'] if filme else '' }}">

    <label>Nota (de 1 a 10)</label>
    <input type="number" name="nota" min="1" max="10" required value="{{ filme['nota'] if filme else '' }}">

    <button type="submit">Salvar</button>
    <a class="botao vermelho" href="/">Cancelar</a>
</form>

{% endblock %}
